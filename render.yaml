# Render Blueprint: 햇빛구 육아용품 대여실 백엔드
# 형식: https://render.com/docs/blueprint-spec
#
# - DB는 이미 Render에 있는 Postgres(baby-rental-db, DB 이름 babyrental, Oregon)를 씁니다.
#   이 파일에는 databases 항목을 넣지 않아 Blueprint가 새 DB를 만들지 않습니다.
# - DATABASE_URL은 Blueprint를 처음 적용할 때 기존 DB의 "Internal Database URL"을 붙여 넣습니다.
# - 무료 웹 서비스는 preDeployCommand를 쓸 수 없어서, 서버 시작 직전에 마이그레이션을 실행합니다.
#   (이미 적용된 마이그레이션은 건너뛰므로 기존 데이터는 그대로입니다.)
# - 비밀값(DB 주소, 비밀번호, API 키)은 이 파일에 적지 않습니다.

services:
  - type: web
    name: baby-rental-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    # 테이블 생성·변경(마이그레이션)을 먼저 적용한 뒤 서버를 켭니다.
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 기존 baby-rental-db의 Internal Database URL. 처음 Blueprint를 만들 때 Render가 입력을 요청합니다.
      - key: DATABASE_URL
        sync: false
      # Vercel 프론트엔드 주소 (쉼표로 여러 개 가능). 처음 Blueprint를 만들 때 입력합니다.
      - key: FRONTEND_ORIGIN
        sync: false
